<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Messages | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-root"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Messages</h2>
      <div class="topbar-right"><span class="user-tag" id="user-tag"></span></div>
    </div>
    <div class="admin-content">
      <div class="admin-panel">
        <div class="panel-header"><h3>All Contact Messages</h3></div>
        <div class="panel-body" id="msg-list"><p class="empty-state">Loading…</p></div>
      </div>
    </div>
  </main>
</div>
<script type="module">
  import { requireAuth, setupSignOut, highlightNav, renderSidebar, db, showToast } from './js/admin.js';
  import { collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
  document.getElementById('sidebar-root').innerHTML = renderSidebar();
  requireAuth(); setupSignOut(); highlightNav();

  async function load() {
    const el = document.getElementById('msg-list');
    try {
      const snap = await getDocs(query(collection(db,'messages'), orderBy('createdAt','desc')));
      if (snap.empty) { el.innerHTML='<p class="empty-state">No messages received yet.</p>'; return; }
      el.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        el.innerHTML += `
          <div class="booking-card" style="position:relative;">
            <div class="booking-name">${m.name||'—'} <span style="font-weight:300;color:var(--white-faint);font-size:0.85rem;">&lt;${m.email||''}&gt;</span></div>
            <div class="booking-meta">${m.subject||'General'} · ${m.createdAt?.toDate?.().toLocaleString('en-GB')||'—'}</div>
            <div class="booking-msg">${m.message||''}</div>
            <button onclick="delMsg('${d.id}')" style="position:absolute;top:1rem;right:1rem;font-size:1rem;color:var(--white-faint);cursor:pointer;background:none;border:none;transition:color 0.2s;" onmouseover="this.style.color='#e05555'" onmouseout="this.style.color='var(--white-faint)'">🗑️</button>
          </div>`;
      });
    } catch(e) { el.innerHTML='<p class="empty-state">Error loading messages.</p>'; }
  }

  window.delMsg = async (id) => {
    if (!confirm('Delete this message?')) return;
    try { await deleteDoc(doc(db,'messages',id)); showToast('Message deleted.'); load(); }
    catch(e) { showToast('Error.','error'); }
  };
  load();
</script>
</body>
</html>
