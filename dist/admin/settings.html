<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Settings | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-root"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Site Settings</h2>
      <div class="topbar-right"><span class="user-tag" id="user-tag"></span></div>
    </div>
    <div class="admin-content">
      <div class="admin-panel">
        <div class="panel-header"><h3>Homepage Settings</h3></div>
        <div class="panel-body">
          <form class="admin-form" id="settings-form">
            <div class="form-group"><label>Hero Title (3 words, space-separated)</label><input id="s-heroTitle" placeholder="FRAMING TRUTH FILM"/></div>
            <div class="form-group"><label>Hero Subtitle / Description</label><textarea id="s-heroSubtitle" rows="3" placeholder="I live between the courtroom and the camera…"></textarea></div>
            <div class="form-group"><label>Featured Quote</label><textarea id="s-heroQuote" rows="3" placeholder="I live between the courtroom and the camera…"></textarea></div>
            <div class="form-group"><label>Footer About Text</label><textarea id="s-footerAbout" rows="2" placeholder="Between the courtroom and the camera…"></textarea></div>
            <button type="submit" class="btn-submit" id="s-submit">SAVE SETTINGS</button>
          </form>
        </div>
      </div>

      <div class="admin-panel" style="margin-top:1.5rem;">
        <div class="panel-header"><h3>Account</h3></div>
        <div class="panel-body">
          <p style="color:var(--white-muted);font-size:0.9rem;margin-bottom:1rem;">Signed in as: <strong id="account-email" style="color:var(--white);">—</strong></p>
          <a href="../index.html" target="_blank" class="btn-submit" style="text-decoration:none;display:inline-block;">View Public Site →</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module">
  import { requireAuth, setupSignOut, highlightNav, renderSidebar, db, showToast, auth } from './js/admin.js';
  import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
  document.getElementById('sidebar-root').innerHTML = renderSidebar();
  requireAuth(user => { document.getElementById('account-email').textContent = user.email; });
  setupSignOut(); highlightNav();

  const keys = ['heroTitle','heroSubtitle','heroQuote','footerAbout'];

  async function load() {
    try {
      const snap = await getDoc(doc(db,'settings','site'));
      if (!snap.exists()) return;
      const d = snap.data();
      keys.forEach(k => { const el=document.getElementById('s-'+k); if(el && d[k]) el.value=d[k]; });
    } catch(e) {}
  }

  document.getElementById('settings-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('s-submit'); btn.textContent='SAVING...'; btn.disabled=true;
    const data = { updatedAt: serverTimestamp() };
    keys.forEach(k => { const el=document.getElementById('s-'+k); if(el) data[k]=el.value.trim(); });
    try {
      await setDoc(doc(db,'settings','site'), data, {merge:true});
      showToast('Settings saved!');
    } catch(err) { showToast('Error saving.','error'); }
    btn.textContent='SAVE SETTINGS'; btn.disabled=false;
  });
  load();
</script>
</body>
</html>
