<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Gallery | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-root"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Gallery</h2>
      <div class="topbar-right"><span class="user-tag" id="user-tag"></span></div>
    </div>
    <div class="admin-content">
      <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:1.5rem;align-items:start;">
        <div class="admin-panel">
          <div class="panel-header"><h3 id="form-title">Add Photo</h3></div>
          <div class="panel-body">
            <form class="admin-form" id="gallery-form">
              <input type="hidden" id="g-id"/>
              <div class="form-group"><label>Image URL *</label><input id="g-url" type="url" placeholder="https://..." required/></div>
              <div class="form-group"><label>Caption</label><input id="g-caption" placeholder="Short description"/></div>
              <div class="form-group"><label>Category</label><input id="g-cat" placeholder="e.g. Portraits, Rwanda, Film Set"/></div>
              <div class="form-group"><label>Status</label>
                <select id="g-status"><option value="visible">Visible</option><option value="hidden">Hidden</option></select>
              </div>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                <button type="submit" class="btn-submit" id="g-submit">ADD PHOTO</button>
                <button type="button" class="btn-submit" id="g-cancel" style="display:none;background:var(--black-border);color:var(--white);">CANCEL</button>
              </div>
            </form>
          </div>
        </div>
        <div class="admin-panel">
          <div class="panel-header"><h3>All Photos</h3></div>
          <div class="panel-body"><div id="gallery-list"><p class="empty-state">Loading…</p></div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module">
  import { requireAuth, setupSignOut, highlightNav, renderSidebar, db, showToast } from './js/admin.js';
  import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
  document.getElementById('sidebar-root').innerHTML = renderSidebar();
  requireAuth(); setupSignOut(); highlightNav();
  let editingId = null;

  async function load() {
    const el = document.getElementById('gallery-list');
    try {
      const snap = await getDocs(query(collection(db,'gallery'), orderBy('createdAt','desc')));
      if (snap.empty) { el.innerHTML='<p class="empty-state">No photos yet.</p>'; return; }
      el.innerHTML = '';
      snap.forEach(d => {
        const f = d.data();
        el.innerHTML += `
          <div class="item-card">
            <div class="item-thumb"><img src="${f.imageUrl}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:4px;"/></div>
            <div class="item-info">
              <div class="item-title">${f.caption||'(no caption)'}</div>
              <div class="item-meta">${f.category||''} · <span class="status-badge ${f.status}">${f.status}</span></div>
            </div>
            <div class="item-actions">
              <button class="btn-icon" onclick="editItem('${d.id}')">✏️</button>
              <button class="btn-icon danger" onclick="delItem('${d.id}')">🗑️</button>
            </div>
          </div>`;
      });
    } catch(e) { el.innerHTML='<p class="empty-state">Error loading.</p>'; }
  }

  document.getElementById('gallery-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('g-submit'); btn.textContent='SAVING...'; btn.disabled=true;
    const data = { imageUrl: document.getElementById('g-url').value.trim(), caption: document.getElementById('g-caption').value.trim(), category: document.getElementById('g-cat').value.trim(), status: document.getElementById('g-status').value };
    try {
      if (editingId) { await updateDoc(doc(db,'gallery',editingId),{...data,updatedAt:serverTimestamp()}); showToast('Updated!'); cancelEdit(); }
      else { await addDoc(collection(db,'gallery'),{...data,createdAt:serverTimestamp()}); showToast('Added!'); e.target.reset(); }
      load();
    } catch(err) { showToast('Error saving.','error'); }
    btn.textContent = editingId?'UPDATE':'ADD PHOTO'; btn.disabled=false;
  });

  window.editItem = async (id) => {
    const snap = await getDocs(collection(db,'gallery'));
    snap.forEach(d => {
      if (d.id!==id) return;
      const f=d.data(); editingId=id;
      document.getElementById('g-url').value=f.imageUrl||'';
      document.getElementById('g-caption').value=f.caption||'';
      document.getElementById('g-cat').value=f.category||'';
      document.getElementById('g-status').value=f.status||'visible';
      document.getElementById('form-title').textContent='Edit Photo';
      document.getElementById('g-submit').textContent='UPDATE';
      document.getElementById('g-cancel').style.display='inline-flex';
    });
  };
  window.delItem = async (id) => {
    if (!confirm('Delete this photo?')) return;
    try { await deleteDoc(doc(db,'gallery',id)); showToast('Deleted.'); load(); } catch(e) { showToast('Error.','error'); }
  };
  function cancelEdit() { editingId=null; document.getElementById('gallery-form').reset(); document.getElementById('form-title').textContent='Add Photo'; document.getElementById('g-submit').textContent='ADD PHOTO'; document.getElementById('g-cancel').style.display='none'; }
  document.getElementById('g-cancel').addEventListener('click', cancelEdit);
  load();
</script>
</body>
</html>
