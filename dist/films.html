  <section class="section" style="padding-top:3rem;">

  <script src="js/main.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
    const cfg = {apiKey:"AIzaSyBbudjWIFVdkFbvewv6FNEkfCTJIOhyTA8",authDomain:"nikuzeportfolio.firebaseapp.com",projectId:"nikuzeportfolio",storageBucket:"nikuzeportfolio.firebasestorage.app",messagingSenderId:"158373976578",appId:"1:158373976578:web:080a58461a2bbcb616651b"};
    const app = initializeApp(cfg);
    const db = getFirestore(app);

    let allFilms = [];

    async function loadFilms() {
      const grid = document.getElementById('films-grid');
      const tabs = document.getElementById('filter-tabs');
      try {
        const q = query(collection(db, 'films'), where('status','==','visible'));
        const snap = await getDocs(q);
        if (snap.empty) { grid.innerHTML='<p class="empty-msg" style="grid-column:1/-1">No films published yet.</p>'; return; }
        const cats = new Set(['all']);
        allFilms = [];
        snap.forEach(d => { const item = {...d.data(), id: d.id}; allFilms.push(item); if(item.category) cats.add(item.category); });
        // Build tabs
        tabs.innerHTML = '';
        cats.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'filter-tab' + (c==='all'?' active':'');
          btn.dataset.cat = c;
          btn.textContent = c === 'all' ? 'All' : c;
          btn.addEventListener('click', () => { tabs.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderFilms(c); });
          tabs.appendChild(btn);
        });
        renderFilms('all');
      } catch(e) { grid.innerHTML='<p class="empty-msg" style="grid-column:1/-1">Could not load films.</p>'; console.error(e); }
    }

    function renderFilms(cat) {
      const grid = document.getElementById('films-grid');
      const filtered = cat === 'all' ? allFilms : allFilms.filter(f => f.category === cat);
      if (!filtered.length) { grid.innerHTML='<p class="empty-msg" style="grid-column:1/-1">No items in this category.</p>'; return; }
      grid.innerHTML = filtered.map(item => `
        <div class="work-card">
          <div class="work-card-thumb">
            ${item.thumbnail ? `<img src="${item.thumbnail}" alt="${item.title}" loading="lazy"/>` : `<div class="thumb-placeholder">🎬</div>`}
            <div class="work-card-overlay">
              <a href="${item.sourceLink||'#'}" target="_blank" rel="noopener" class="btn-view">View Work</a>
            </div>
          </div>
          <div class="work-card-info">
            <span class="work-tag">${item.category||'Film'}</span>
            <h3>${item.title}</h3>
          </div>
        </div>`).join('');
    }
    loadFilms();
  </script>
</body>
