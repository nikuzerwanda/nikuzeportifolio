<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Law | NIKUZE JOSELYNE</title>
  <meta name="description" content="Legal work and writings by NIKUZE JOSELYNE — law student exploring justice in Rwanda and beyond."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .law-list{display:flex;flex-direction:column;gap:1.5rem;}
    .law-item{background:var(--black-card);border:1px solid var(--black-border);border-radius:4px;padding:2rem;transition:border-color 0.3s ease;cursor:pointer;}
    .law-item:hover{border-color:var(--white-faint);}
    .law-item-tag{font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--white-faint);margin-bottom:0.7rem;display:block;}
    .law-item h3{font-family:var(--font-display);font-size:1.5rem;font-weight:300;margin-bottom:0.7rem;}
    .law-item p{color:var(--white-muted);line-height:1.7;font-size:0.95rem;}
    .law-item .law-link{display:inline-block;margin-top:1rem;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white-faint);transition:color 0.2s;}
    .law-item:hover .law-link{color:var(--white);}
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo"><span class="logo-first">NIKUZE</span><span class="logo-last"> JOSELYNE</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">HOME</a></li>
        <li><a href="films.html">FILMS</a></li>
        <li><a href="law.html">LAW</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="contact.html" class="nav-cta">CONTACT</a></li>
      </ul>
    </div>
  </nav>

  <section class="page-hero">
    <div class="container">
      <p class="section-eyebrow">Justice & Advocacy</p>
      <h1>Legal Work</h1>
      <p>Where justice is written, argued, and sometimes broken.</p>
    </div>
  </section>

  <section class="section" style="padding-top:3rem;">
    <div class="container">
      <div id="law-list" class="law-list">
        <div class="work-card skeleton" style="height:150px;"></div>
        <div class="work-card skeleton" style="height:150px;"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 Nikuze Joselyne. All rights reserved.</p>
        <a href="admin/index.html" class="admin-link">Admin</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
    const cfg = {apiKey:"AIzaSyBbudjWIFVdkFbvewv6FNEkfCTJIOhyTA8",authDomain:"nikuzeportfolio.firebaseapp.com",projectId:"nikuzeportfolio",storageBucket:"nikuzeportfolio.firebasestorage.app",messagingSenderId:"158373976578",appId:"1:158373976578:web:080a58461a2bbcb616651b"};
    const app = initializeApp(cfg);
    const db = getFirestore(app);
    async function load() {
      const list = document.getElementById('law-list');
      try {
        const q = query(collection(db,'law'), where('status','==','visible'));
        const snap = await getDocs(q);
        if (snap.empty) { list.innerHTML='<p class="empty-msg">No legal works published yet.</p>'; return; }
        list.innerHTML='';
        snap.forEach(d => {
          const item = d.data();
          list.innerHTML += `
            <div class="law-item" onclick="${item.sourceLink?`window.open('${item.sourceLink}','_blank')`:''}" >
              <span class="law-item-tag">${item.category||'Law'}</span>
              <h3>${item.title}</h3>
              <p>${item.description||''}</p>
              ${item.sourceLink?`<span class="law-link">Read More →</span>`:''}
            </div>`;
        });
      } catch(e) { list.innerHTML='<p class="empty-msg">Could not load legal works.</p>'; }
    }
    load();
  </script>
</body>
</html>
