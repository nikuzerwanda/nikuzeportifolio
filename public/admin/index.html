<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login | NIKUZE JOSELYNE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <p>Admin Portal</p>
        <h1>NIKUZE JOSELYNE</h1>
      </div>
      <form class="login-form" id="login-form">
        <div>
          <label for="l-email">Email</label>
          <input id="l-email" type="email" placeholder="your@email.com" required/>
        </div>
        <div>
          <label for="l-pass">Password</label>
          <input id="l-pass" type="password" placeholder="••••••••" required/>
        </div>
        <p class="login-error" id="login-error">Invalid credentials. Please try again.</p>
        <button type="submit" class="btn-login" id="login-btn">SIGN IN</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
    const cfg = {apiKey:"AIzaSyBbudjWIFVdkFbvewv6FNEkfCTJIOhyTA8",authDomain:"nikuzeportfolio.firebaseapp.com",projectId:"nikuzeportfolio",storageBucket:"nikuzeportfolio.firebasestorage.app",messagingSenderId:"158373976578",appId:"1:158373976578:web:080a58461a2bbcb616651b"};
    const app = initializeApp(cfg);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      btn.textContent = 'SIGNING IN...'; btn.disabled = true; err.style.display = 'none';
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('l-email').value, document.getElementById('l-pass').value);
        window.location.href = 'dashboard.html';
      } catch(ex) {
        err.style.display = 'block';
        btn.textContent = 'SIGN IN'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
