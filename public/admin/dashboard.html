<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-root"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Dashboard</h2>
      <div class="topbar-right">
        <span class="user-tag" id="user-tag"></span>
        <a href="../index.html" target="_blank" style="font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white-faint);transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--white-faint)'">View Site →</a>
      </div>
    </div>
    <div class="admin-content">
      <div class="dash-cards">
        <div class="dash-card"><p class="card-label">Films</p><p class="card-value" id="cnt-films">—</p><p class="card-sub">Published works</p></div>
        <div class="dash-card"><p class="card-label">Legal Works</p><p class="card-value" id="cnt-law">—</p><p class="card-sub">Published items</p></div>
        <div class="dash-card"><p class="card-label">Gallery</p><p class="card-value" id="cnt-gallery">—</p><p class="card-sub">Published photos</p></div>
        <div class="dash-card"><p class="card-label">Messages</p><p class="card-value" id="cnt-messages">—</p><p class="card-sub">Total received</p></div>
      </div>

      <div class="admin-panel">
        <div class="panel-header"><h3>Quick Actions</h3></div>
        <div class="panel-body" style="display:flex;gap:1rem;flex-wrap:wrap;">
          <a href="films.html" class="btn-submit" style="text-decoration:none;">+ Add Film</a>
          <a href="law.html" class="btn-submit" style="text-decoration:none;">+ Add Legal Work</a>
          <a href="gallery.html" class="btn-submit" style="text-decoration:none;">+ Add Photo</a>
          <a href="messages.html" class="btn-submit" style="text-decoration:none;background:var(--black-border);color:var(--white);">View Messages</a>
        </div>
      </div>

      <div class="admin-panel">
        <div class="panel-header"><h3>Recent Messages</h3></div>
        <div class="panel-body" id="recent-msgs"><p class="empty-state">Loading…</p></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth, setupSignOut, highlightNav, renderSidebar, db } from './js/admin.js';
  import { collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

  document.getElementById('sidebar-root').innerHTML = renderSidebar();
  requireAuth();
  setupSignOut();
  highlightNav();

  async function loadCounts() {
    const colls = ['films','law','gallery','messages'];
    const ids = ['cnt-films','cnt-law','cnt-gallery','cnt-messages'];
    for (let i = 0; i < colls.length; i++) {
      try {
        const snap = await getDocs(collection(db, colls[i]));
        document.getElementById(ids[i]).textContent = snap.size;
      } catch(e) { document.getElementById(ids[i]).textContent = '0'; }
    }
  }

  async function loadRecentMessages() {
    const el = document.getElementById('recent-msgs');
    try {
      const q = query(collection(db,'messages'), orderBy('createdAt','desc'), limit(5));
      const snap = await getDocs(q);
      if (snap.empty) { el.innerHTML='<p class="empty-state">No messages yet.</p>'; return; }
      el.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        el.innerHTML += `
          <div class="booking-card">
            <div class="booking-name">${m.name||'Unknown'} <span style="font-weight:300;color:var(--white-faint);">&lt;${m.email||''}&gt;</span></div>
            <div class="booking-meta">${m.subject||''} · ${m.createdAt?.toDate?.().toLocaleDateString('en-GB')||'—'}</div>
            <div class="booking-msg">${m.message||''}</div>
          </div>`;
      });
    } catch(e) { el.innerHTML='<p class="empty-state">Could not load messages.</p>'; }
  }

  loadCounts();
  loadRecentMessages();
</script>
</body>
</html>
