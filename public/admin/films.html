<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Films | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-root"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Films</h2>
      <div class="topbar-right"><span class="user-tag" id="user-tag"></span></div>
    </div>
    <div class="admin-content">
      <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:1.5rem;align-items:start;">
        <!-- ADD FORM -->
        <div class="admin-panel">
          <div class="panel-header"><h3 id="form-title">Add New Film</h3></div>
          <div class="panel-body">
            <form class="admin-form" id="film-form">
              <input type="hidden" id="film-id"/>
              <div class="form-group"><label>Title *</label><input id="f-title" placeholder="Film title" required/></div>
              <div class="form-group"><label>Category</label>
                <select id="f-category">
                  <option value="Documentary">Documentary</option>
                  <option value="Short Film">Short Film</option>
                  <option value="Feature">Feature</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group"><label>Thumbnail URL</label><input id="f-thumb" type="url" placeholder="https://..."/></div>
              <div class="form-group"><label>Source / Watch Link</label><input id="f-link" type="url" placeholder="https://youtube.com/..."/></div>
              <div class="form-group"><label>Description</label><textarea id="f-desc" placeholder="Brief description…"></textarea></div>
              <div class="form-group"><label>Status</label>
                <select id="f-status"><option value="visible">Visible</option><option value="hidden">Hidden</option></select>
              </div>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                <button type="submit" class="btn-submit" id="film-submit">ADD FILM</button>
                <button type="button" class="btn-submit" id="film-cancel" style="display:none;background:var(--black-border);color:var(--white);">CANCEL</button>
              </div>
            </form>
          </div>
        </div>
        <!-- LIST -->
        <div class="admin-panel">
          <div class="panel-header"><h3>All Films</h3></div>
          <div class="panel-body"><div id="films-list"><p class="empty-state">Loading…</p></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth, setupSignOut, highlightNav, renderSidebar, db, showToast } from './js/admin.js';
  import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

  document.getElementById('sidebar-root').innerHTML = renderSidebar();
  requireAuth(); setupSignOut(); highlightNav();

  let editingId = null;

  async function loadFilms() {
    const el = document.getElementById('films-list');
    try {
      const snap = await getDocs(query(collection(db,'films'), orderBy('createdAt','desc')));
      if (snap.empty) { el.innerHTML='<p class="empty-state">No films yet. Add your first one.</p>'; return; }
      el.innerHTML = '';
      snap.forEach(d => {
        const f = d.data();
        el.innerHTML += `
          <div class="item-card">
            <div class="item-thumb">${f.thumbnail?`<img src="${f.thumbnail}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:4px;">`:'🎬'}</div>
            <div class="item-info">
              <div class="item-title">${f.title}</div>
              <div class="item-meta">${f.category||''} · <span class="status-badge ${f.status}">${f.status}</span></div>
            </div>
            <div class="item-actions">
              <button class="btn-icon" onclick="editFilm('${d.id}')">✏️</button>
              <button class="btn-icon danger" onclick="deleteFilm('${d.id}')">🗑️</button>
            </div>
          </div>`;
      });
    } catch(e) { el.innerHTML='<p class="empty-state">Error loading films.</p>'; }
  }

  document.getElementById('film-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('film-submit');
    btn.textContent = 'SAVING...'; btn.disabled = true;
    const data = {
      title: document.getElementById('f-title').value.trim(),
      category: document.getElementById('f-category').value,
      thumbnail: document.getElementById('f-thumb').value.trim(),
      sourceLink: document.getElementById('f-link').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      status: document.getElementById('f-status').value
    };
    try {
      if (editingId) {
        await updateDoc(doc(db,'films',editingId), {...data, updatedAt: serverTimestamp()});
        showToast('Film updated!');
        cancelEdit();
      } else {
        await addDoc(collection(db,'films'), {...data, createdAt: serverTimestamp()});
        showToast('Film added!');
        e.target.reset();
      }
      loadFilms();
    } catch(err) { showToast('Error saving film.','error'); }
    btn.textContent = editingId ? 'UPDATE FILM' : 'ADD FILM'; btn.disabled = false;
  });

  window.editFilm = async (id) => {
    const snap = await getDocs(collection(db,'films'));
    snap.forEach(d => {
      if (d.id !== id) return;
      const f = d.data();
      editingId = id;
      document.getElementById('f-title').value = f.title||'';
      document.getElementById('f-category').value = f.category||'Documentary';
      document.getElementById('f-thumb').value = f.thumbnail||'';
      document.getElementById('f-link').value = f.sourceLink||'';
      document.getElementById('f-desc').value = f.description||'';
      document.getElementById('f-status').value = f.status||'visible';
      document.getElementById('form-title').textContent = 'Edit Film';
      document.getElementById('film-submit').textContent = 'UPDATE FILM';
      document.getElementById('film-cancel').style.display = 'inline-flex';
    });
  };

  window.deleteFilm = async (id) => {
    if (!confirm('Delete this film? This cannot be undone.')) return;
    try { await deleteDoc(doc(db,'films',id)); showToast('Film deleted.'); loadFilms(); }
    catch(e) { showToast('Error deleting.','error'); }
  };

  function cancelEdit() {
    editingId = null;
    document.getElementById('film-form').reset();
    document.getElementById('form-title').textContent = 'Add New Film';
    document.getElementById('film-submit').textContent = 'ADD FILM';
    document.getElementById('film-cancel').style.display = 'none';
  }
  document.getElementById('film-cancel').addEventListener('click', cancelEdit);
  loadFilms();
</script>
</body>
</html>
